name: Build and publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: npm/@leonsilicon/napi-typos

jobs:
  build:
    name: Build and test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            build-flag: --use-napi-cross
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            build-flag: --use-napi-cross
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            build-flag: --cross-compile
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            build-flag: --cross-compile
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-2025

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          architecture: ${{ startsWith(matrix.target, 'aarch64-') && 'arm64' || 'x64' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'musl')
        with:
          version: '0.15.2'
      - uses: taiki-e/install-action@v2
        if: contains(matrix.target, 'musl')
        with:
          tool: cargo-zigbuild
      - name: Install build dependencies
        run: bun ci
        working-directory: .
      - run: cargo fetch --locked --target ${{ matrix.target }}
      - name: Build addon
        run: bun run build --target ${{ matrix.target }} ${{ matrix.build-flag }}
        env:
          CARGO_NET_OFFLINE: 'true'
      - run: git diff --exit-code -- Cargo.lock
      - name: Test addon on Node
        if: "!contains(matrix.target, 'musl')"
        run: bun run test
      - name: Test the Bun module entry
        if: "!contains(matrix.target, 'musl')"
        run: bun run test:bun
      - name: Test addon on Alpine
        if: contains(matrix.target, 'musl')
        run: docker run --rm --volume "${PWD}:/addon:ro" --workdir /addon node:24-alpine node --test
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: |
            npm/@leonsilicon/napi-typos/napi-typos.*.node
            npm/@leonsilicon/napi-typos/index.cjs
            npm/@leonsilicon/napi-typos/index.d.ts
          if-no-files-found: error

  publish:
    name: Publish to npm and GitHub Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun ci
        working-directory: .
      - name: Check the release tag
        run: |
          node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) throw Error("Tag must match package.json version")'
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: npm/@leonsilicon/napi-typos/artifacts
      - name: Assemble all platform packages
        run: |
          bun run napi create-npm-dirs
          bun run napi artifacts --output-dir artifacts
          cp artifacts/bindings-aarch64-apple-darwin/{index.cjs,index.d.ts} .
          for package_dir in npm/*/; do
            cp LICENSE-APACHE LICENSE-MIT "$package_dir"
            jq '.files += ["LICENSE-APACHE", "LICENSE-MIT"]' "$package_dir/package.json" > "$package_dir/package.json.tmp"
            mv "$package_dir/package.json.tmp" "$package_dir/package.json"
          done
          bun run napi prepublish -t npm --no-gh-release --skip-optional-publish --root-publisher npm
      - name: Publish packages and verify installable tarballs
        run: node scripts/publish-npm.mjs "$RUNNER_TEMP/napi-typos-release"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
      - name: Publish verified tarballs to GitHub Releases
        working-directory: ${{ runner.temp }}/napi-typos-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
            flags=()
            if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$tag" --generate-notes "${flags[@]}"
            draft=true
          fi
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
              ./*.tgz LICENSE-APACHE LICENSE-MIT SHA256SUMS
          fi
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq -er --arg tag "$tag" '.[] | select(.tag_name == $tag) | .id')
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate > uploaded-assets.json
          jq -er '.[] | select(.state == "uploaded") | "\(.digest | sub("^sha256:"; ""))  \(.name)"' \
            uploaded-assets.json | sort > uploaded-checksums.txt
          { cat SHA256SUMS; sha256sum SHA256SUMS; } | sort > expected-checksums.txt
          diff -u expected-checksums.txt uploaded-checksums.txt
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
